name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt check
        run: test -z "$(gofmt -l services/api)"
      - name: vet
        working-directory: services/api
        run: go vet ./...
      - name: test
        working-directory: services/api
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install
        working-directory: apps/web
        run: npm install
      - name: build
        working-directory: apps/web
        run: npm run build
